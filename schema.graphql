type Game @entity(immutable: false) {
  id: ID! # requestId as string
  requestId: BigInt!
  playerAddress: Bytes!

  # Fields from GameStarted
  bet: BigInt
  coef: BigInt
  startedBlockNumber: BigInt
  startedBlockTimestamp: BigInt
  startedTransactionHash: Bytes

  # Fields from GameReleased
  payout: BigInt
  randomNumber: BigInt
  x: BigInt
  releasedBlockNumber: BigInt
  releasedBlockTimestamp: BigInt
  releasedTransactionHash: Bytes
}

type VaultSnapshot @entity(immutable: false) {
  id: ID!
  totalAssets: BigInt!
  totalSupply: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  day: BigInt!
}

type Referrer @entity(immutable: false) {
  id: ID!
  address: Bytes!
  totalRewardAssets: BigInt!
  rewardCount: Int!
  referredPlayers: Int!
  referredWallets: Int!
  firstRewardAt: BigInt
  lastRewardAt: BigInt
  rewards: [ReferralReward!]! @derivedFrom(field: "referrer")
  referrals: [Referral!]! @derivedFrom(field: "referrer")
}

type Referral @entity(immutable: false) {
  id: ID!
  referee: Bytes!
  referrer: Referrer!
  totalRewardAssets: BigInt!
  rewardCount: Int!
  settledBlockNumber: BigInt
  settledBlockTimestamp: BigInt
  settledTransactionHash: Bytes
  firstRewardAt: BigInt
  lastRewardAt: BigInt
  rewards: [ReferralReward!]! @derivedFrom(field: "referral")
}

type ReferralReward @entity(immutable: true) {
  id: ID!
  referrer: Referrer!
  referral: Referral!
  player: Bytes!
  assets: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}
